server:
  address: ${APP_BIND:127.0.0.1}
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${APP_SECURE_COOKIE:false}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/used_car?connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:used_car}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  demo: ${APP_DEMO:false}
  admin-password: ${APP_ADMIN_PASSWORD:}
  uploads: ${APP_UPLOADS:./data/uploads}
